# Self-hosted n8n: Postgres + n8n, with an optional Caddy reverse proxy for HTTPS.
#
#   ./start.sh                       -> local, http://localhost:5678
#   docker compose --profile https up -d   -> on a server with a domain (see README)

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
  TZ: ${GENERIC_TIMEZONE}
  N8N_HOST: ${N8N_HOST}
  N8N_PROTOCOL: ${N8N_PROTOCOL}
  N8N_PORT: 5678
  WEBHOOK_URL: ${N8N_PROTOCOL}://${N8N_HOST}${N8N_PUBLIC_PORT_SUFFIX}/
  N8N_EDITOR_BASE_URL: ${N8N_PROTOCOL}://${N8N_HOST}${N8N_PUBLIC_PORT_SUFFIX}/
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: 336 # hours (14 days)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: imports the demo workflow + credentials on first boot only.
  n8n-init:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    environment:
      <<: *n8n-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    entrypoint: /bin/sh
    command: /demo/init/import-demo.sh
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/demo/workflows:ro
      - ./init:/demo/init:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    environment: *n8n-env
    ports:
      - "${N8N_BIND_ADDRESS}:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      n8n-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
